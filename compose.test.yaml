services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${GOHUB_TEST_MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: gohub_test
      MYSQL_USER: gohub_test
      MYSQL_PASSWORD: ${GOHUB_TEST_MYSQL_PASSWORD:?required}

    ports:
      - "127.0.0.1:13306:3306"

    volumes:
      - mysql_test_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql -h 127.0.0.1
          -u "$${MYSQL_USER}"
          -D "$${MYSQL_DATABASE}"
          -Nse 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  mysql_test_data: